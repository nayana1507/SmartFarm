function graph(){const w=640,h=300,x0=34,y0=10,pw=w-x0-8,ph=h-y0-24,X=v=>x0+pw*(v-(t-60))/60,Y=v=>y0+ph*(1-(v-20)/30);G.clearRect(0,0,w,h);G.font='12px system-ui';G.fillStyle='#889';G.textAlign='right';
[20,30,42,50].forEach(v=>{G.fillText(v,x0-4,Y(v)+4)});[[30,'#e0352b'],[42,'#2fa34f']].forEach(a=>{G.beginPath();G.setLineDash([6,4]);G.moveTo(x0,Y(a[0]));G.lineTo(w-8,Y(a[0]));G.strokeStyle=a[1];G.stroke();G.setLineDash([])});
for(let z=4;z>=0;z--){G.beginPath();let f=1;hist.forEach(p=>{if(p[0]<t-60)return;const x=X(p[0]),y=Y(p[z+1]);f?G.moveTo(x,y):G.lineTo(x,y);f=0});G.strokeStyle=z?Z[z].c+'99':'#888';G.lineWidth=z?1.2:0;if(z)G.stroke()}
for(let i=1;i<hist.length;i++){if(hist[i][0]<t-60)continue;G.beginPath();G.moveTo(X(hist[i-1][0]),Y(hist[i-1][1]));G.lineTo(X(hist[i][0]),Y(hist[i][1]));G.strokeStyle=col(hist[i][1]);G.lineWidth=3.5;G.stroke()}
G.fillStyle='#889';G.textAlign='left';G.fillText('lower 30% / upper 42%  (last 60 s)',x0+4,h-6)}
function frame(ts){const dt=Math.min(.05,(ts-(frame.l||ts))/1000);frame.l=ts;if(play){t+=dt;ang+=dt*14;wheel+=dt*10*0;if(trig===null&&t>=4)trig=t}
const st=trig===null?-1:t-trig,S=derive(st);if(S.fl>0)wheel+=S.fl*dt*4;if(S.on)ang+=dt*0;
if(play&&t-lastH>=.2){lastH=t;hist.push([t,...S.m]);if(hist.length>400)hist.shift()}
draw(S);ui(S);graph();requestAnimationFrame(frame)}
$('bp').onclick=()=>play=true;$('bq').onclick=()=>play=false;$('bt').onclick=()=>{if(trig===null){play=true;trig=t}};
$('br').onclick=()=>{t=0;trig=null;play=false;hist=[];lastH=-1};
requestAnimationFrame(frame);
</script></body></html>
